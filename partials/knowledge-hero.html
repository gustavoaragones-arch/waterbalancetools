<!-- knowledge-hero.html — tokens: {{BADGE}}, {{BADGE_CLASS}}, {{READING_TIME}},
     {{LAST_REVIEWED}}, {{TITLE}}, {{SUMMARY}}, {{CHIPS}} -->
<section class="knowledge-hero">
  <div class="knowledge-hero-meta">
    <span class="knowledge-badge {{BADGE_CLASS}}">{{BADGE}}</span>
    <span class="knowledge-hero-reading">{{READING_TIME}}</span>
    <span class="knowledge-hero-reading" style="opacity:0.6">Updated {{LAST_REVIEWED}}</span>
  </div>
  <h1>{{TITLE}}</h1>
  <p class="knowledge-hero-summary">{{SUMMARY}}</p>
  <nav class="knowledge-chips" aria-label="Page sections">
    {{CHIPS}}
  </nav>
</section>
