<!DOCTYPE html>
<html {{HTML_LANG_ATTR}}>
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/knowledge.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3974004697476579" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{H1_TITLE}}",
    "description": "{{META_DESCRIPTION}}",
    "url": "{{CANONICAL_URL}}",
    "dateModified": "{{LAST_REVIEWED}}",
    "publisher": {
      "@type": "Organization",
      "name": "WaterBalanceTools",
      "url": "https://waterbalancetools.com"
    }
  }
  </script>
  {{BREADCRUMB_SCHEMA}}
</head>
<body class="knowledge-page academy-page">
  <header class="site-header">
    <a href="/" class="logo-link">
      <img src="/public/logo.svg" alt="WaterBalanceTools" class="logo" width="185" height="56">
    </a>
    <nav class="nav" id="site-nav" aria-label="{{ARIA_PRIMARY_NAV}}">
      <a href="{{NAV_CALCULATOR_HREF}}">{{NAV_CALCULATOR_LABEL}}</a>
      <a href="/resources/">{{NAV_RESOURCES}}</a>
      <a href="/pool-chemical-levels-chart">{{NAV_CHARTS}}</a>
      <a href="/academy/">{{NAV_ACADEMY}}</a>
      <a href="/guides/pool-chemistry-basics">{{NAV_GUIDES}}</a>
      <a href="/about/">{{NAV_ABOUT}}</a>
    </nav>
    <div class="nav-end">
      <a href="/search/" class="nav-search" aria-label="{{ARIA_SEARCH}}">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="{{ARIA_OPEN_MENU}}" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  {{BREADCRUMB}}

  <main class="container">
    <div class="knowledge-layout">

      <!-- Sidebar (desktop only) -->
      {{SIDEBAR}}

      <!-- Main content -->
      <div class="knowledge-content">

        {{HERO}}

        <article id="overview">
          {{CONTENT}}
        </article>

        {{RELATED_TOOLS}}

        {{RELATED_TOPICS}}

        {{KNOWLEDGE_FOOTER}}

        <p class="knowledge-sources"><em>{{LAST_REVIEWED_LABEL}} {{LAST_REVIEWED}}</em></p>

      </div><!-- /.knowledge-content -->
    </div><!-- /.knowledge-layout -->
  </main>

  {{SITE_FOOTER}}

  <script src="/js/nav.js" defer></script>
</body>
</html>
